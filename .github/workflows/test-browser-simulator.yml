name: Browser Simulator Tests
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/test_browser_simulator.mjs"
      - "tools/test_browser_playwright.mjs"
      - ".github/workflows/test-browser-simulator.yml"
  pull_request:
    paths:
      - "web/**"
      - "tools/test_browser_simulator.mjs"
      - "tools/test_browser_playwright.mjs"
      - ".github/workflows/test-browser-simulator.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser simulator
        run: |
          test -s web/index.html
          node tools/test_browser_simulator.mjs
          grep -q 'id="room"' web/index.html
          grep -q 'id="runTests"' web/index.html
          grep -q 'simulationOnly:true' web/index.html
          grep -q 'Quest 3' web/index.html
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve simulator and run real-browser tests
        run: |
          python3 -m http.server 4173 --directory web > /tmp/roomscan-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tools/test_browser_playwright.mjs
