name: Build Quest 3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Unity Android ARM64 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository preflight
        run: python3 tools/validate_project.py

      - name: Check required Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Configure UNITY_LICENSE or UNITY_EMAIL + UNITY_PASSWORD repository secrets before running a Unity build."
            exit 1
          fi

      - name: Configure optional Meta UPM authentication
        shell: bash
        env:
          META_UPM_TOKEN: ${{ secrets.META_UPM_TOKEN }}
        run: |
          if [ -n "$META_UPM_TOKEN" ]; then
            mkdir -p "$HOME"
            cat > "$HOME/.upmconfig.toml" <<EOF
          [npmAuth."https://npm.developer.oculus.com"]
          alwaysAuth = true
          token = "$META_UPM_TOKEN"
          EOF
            chmod 600 "$HOME/.upmconfig.toml"
          fi

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          unityVersion: 6000.2.0f1
          targetPlatform: Android
          buildsPath: build
          buildName: ORRoomScanStudio
          allowDirtyBuild: true
          buildMethod: ORRoomScanBuild.BuildAndroid

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OR-RoomScan-Studio-Quest3-APK
          path: Unity/Build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 14
